name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'frontend/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android-apk:
    name: Build and attach APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for on-device mobile execution
        working-directory: frontend
        run: |
          npm ci
          node scripts/build-android.mjs

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle -p android-app assembleDebug

      - name: Upload APK build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CloudVault-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK filename
        if: github.event_name == 'release'
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk "CloudVault-${{ github.event.release.tag_name }}.apk"

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: CloudVault-${{ github.event.release.tag_name }}.apk
