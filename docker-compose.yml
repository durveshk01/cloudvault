services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cloudvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudvault_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-cloudvault}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudvault} -d ${POSTGRES_DB:-cloudvault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (Optional S3-compatible local object storage)
  minio:
    build:
      context: ./docker/minio
    image: cloudvault-minio:community
    container_name: cloudvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudvault_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudvault-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-cloudvault}:${POSTGRES_PASSWORD:-cloudvault_secure_pass_123}@db:5432/${POSTGRES_DB:-cloudvault}
      - APP_SECRET=${APP_SECRET:-cloudvault_local_development_secret_key_change_me}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/app/storage_data
      - S3_BUCKET=${S3_BUCKET:-cloudvault-bucket}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-cloudvault_minio}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minio_secure_pass_123}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Only the ingress below may assert a client address. Never trust '*'.
      - FORWARDED_ALLOW_IPS=172.29.0.10
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_storage:/app/storage_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudvault-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
      - NODE_ENV=production

  # Public same-origin entrypoint. It replaces, rather than appends to,
  # client-supplied forwarded headers and routes API traffic to the backend.
  gateway:
    image: nginx:stable-alpine
    container_name: cloudvault-gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        ipv4_address: 172.29.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  postgres_data:
  minio_data:
  backend_storage:
