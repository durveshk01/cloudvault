services:
  # FastAPI Backend Web Service
  - type: web
    name: cloudvault-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scripts.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudvault-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /tmp/storage_data
      - key: CORS_ORIGINS
        value: https://cloudvault-frontend-tnwe.onrender.com

  # Next.js Frontend Web Service
  - type: web
    name: cloudvault-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: INTERNAL_BACKEND_URL
        value: https://cloudvault-backend-wg5r.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://cloudvault-backend-wg5r.onrender.com

databases:
  - name: cloudvault-db
    region: oregon
    plan: free
    databaseName: cloudvault
    user: cloudvault
    ipAllowList: []
