services:
  # FastAPI Backend Web Service
  - type: web
    name: cloudvault-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloudvault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /tmp/storage_data
      - key: CORS_ORIGINS
        value: "*"

  # Next.js Frontend Web Service
  - type: web
    name: cloudvault-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: INTERNAL_BACKEND_URL
        fromService:
          type: web
          name: cloudvault-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: cloudvault-backend
          property: host

databases:
  - name: cloudvault-db
    region: oregon
    plan: free
    databaseName: cloudvault
    user: cloudvault
